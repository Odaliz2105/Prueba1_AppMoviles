<ion-header>
  <ion-toolbar color="tertiary">
    <ion-title>
      Anime Explorer
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="inicio-content ion-padding">

  <ion-card class="welcome-card">

    <img
      src="https://wallpapercave.com/wp/wp9420688.jpg">

    <ion-card-header>

      <ion-card-title>
        Bienvenido a Anime Explorer
      </ion-card-title>

    </ion-card-header>

    <ion-card-content>

      Explora animes, busca tus favoritos,
      guarda fotos y disfruta la experiencia.

    </ion-card-content>

  </ion-card>

  <ion-card>

    <ion-card-header>
      <ion-card-title>
        Funciones de la aplicación
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-list>

        <ion-item>
          <ion-icon
            name="search"
            slot="start"
            color="primary">
          </ion-icon>

          Buscar animes
        </ion-item>

        <ion-item>
          <ion-icon
            name="camera"
            slot="start"
            color="danger">
          </ion-icon>

          Tomar fotografías
        </ion-item>

        <ion-item>
          <ion-icon
            name="images"
            slot="start"
            color="success">
          </ion-icon>

          Guardar imágenes localmente
        </ion-item>

        <ion-item>
          <ion-icon
            name="person"
            slot="start"
            color="warning">
          </ion-icon>

          Perfil de usuario
        </ion-item>

      </ion-list>

    </ion-card-content>

  </ion-card>

</ion-content>
